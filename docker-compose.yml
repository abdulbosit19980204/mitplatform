version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mitplatform_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mitplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mitplatform_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py load_uz_data &&
             python manage.py seed_demo_data &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=production-secure-key-aqxi-replace-in-real-env
      - DB_NAME=mitplatform
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
      - USE_SQLITE=False
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_media:/app/private_media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mitplatform_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
